<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
 xmlns:f="jakarta.faces.core" xmlns:p="primefaces">
<h:head><title>ContratoFácil | Modelos</title><h:outputStylesheet library="css" name="estilo.css"/></h:head>
<h:body><header><h1>ContratoFácil</h1><nav>
<h:link outcome="/index.xhtml" value="Início"/>
<h:link outcome="/colaboradores.xhtml" value="Colaboradores"/>
<h:link outcome="/tipos.xhtml" value="Tipos"/>
<h:link outcome="/modelos.xhtml" value="Modelos"/>
<h:link outcome="/contratos.xhtml" value="Contratos"/>
<h:form id="formSair" styleClass="form-sair"><h:commandLink action="#{loginBean.sair}" value="Sair"/></h:form>
</nav></header>
<main><h:form id="form"><section class="painel">
<div class="titulo"><div><h2>Modelos de contrato</h2>
<p class="subtitulo">Crie os textos-base que serão usados para gerar documentos.</p></div>
<h:link outcome="/editar-modelo.xhtml" styleClass="link-acao" value="＋ Criar modelo"/>
</div>
<div class="barra"><div class="campo-busca">
<p:outputLabel for="pesquisa" value="Pesquisar por título"/>
<p:inputText id="pesquisa" value="#{modeloContratoBean.pesquisa}" style="width:100%"/>
</div>
<p:commandButton value="Pesquisar" icon="pi pi-search" process="pesquisa @this"
action="#{modeloContratoBean.pesquisar}" update="tabela avisos" styleClass="ui-button-sm"/>
</div>
<p:messages id="avisos" closable="true"/>
<p:dataTable id="tabela" var="modelo" value="#{modeloContratoBean.lista}"
 paginator="true" rows="10" reflow="true" emptyMessage="Nenhum modelo cadastrado.">
<p:column headerText="Código" style="width:90px"><h:outputText value="#{modelo.id}"/></p:column>
<p:column headerText="Título"><h:outputText value="#{modelo.titulo}"/></p:column>
<p:column headerText="Tipo"><h:outputText value="#{modeloContratoBean.nomeTipo(modelo.tipoId)}"/></p:column>
<p:column headerText="Ações" style="width:140px">
<h:link outcome="/editar-modelo.xhtml" styleClass="link-acao-subtil" title="Editar modelo">
<f:param name="id" value="#{modelo.id}"/><i class="pi pi-pencil"></i></h:link>
<p:commandButton icon="pi pi-trash" title="Excluir modelo" ariaLabel="Excluir modelo"
 styleClass="ui-button-danger ui-button-flat ui-button-rounded acao-icone"
 action="#{modeloContratoBean.excluir(modelo.id)}" process="@this" update="tabela avisos">
<p:confirm header="Confirmar" message="Excluir este modelo? Contratos já emitidos serão preservados."/>
</p:commandButton>
</p:column></p:dataTable>
</section>
<p:confirmDialog global="true">
<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no"/>
</p:confirmDialog>
</h:form></main></h:body></html>
