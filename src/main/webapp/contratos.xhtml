<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
xmlns:f="jakarta.faces.core" xmlns:p="primefaces">
<h:head><title>ContratoFácil | Contratos</title><h:outputStylesheet library="css" name="estilo.css"/></h:head>
<h:body><header><h1>ContratoFácil</h1><nav>
<h:link outcome="/index.xhtml" value="Início"/>
<h:link outcome="/colaboradores.xhtml" value="Colaboradores"/>
<h:link outcome="/modelos.xhtml" value="Modelos"/>
<h:link outcome="/contratos.xhtml" value="Contratos"/>
<h:form id="formSair" styleClass="form-sair"><h:commandLink action="#{loginBean.sair}" value="Sair"/></h:form>
</nav></header>
<main><h:form id="form"><section class="painel">
<div class="titulo"><h2>Contratos</h2><h:link outcome="/editar-contrato.xhtml" value="Novo contrato" styleClass="link-acao"/></div>
<div class="barra"><div class="campo-busca">
<p:outputLabel for="pesquisa" value="Pesquisar título, nome ou matrícula"/>
<p:inputText id="pesquisa" value="#{contratoBean.pesquisa}" style="width:100%"/></div>
<p:commandButton value="Pesquisar" process="pesquisa @this" action="#{contratoBean.pesquisar}" update="tabela avisos"/></div>
<p:messages id="avisos" closable="true"/>
<p:dataTable id="tabela" value="#{contratoBean.lista}" var="c" paginator="true" rows="10" reflow="true" emptyMessage="Nenhum contrato cadastrado.">
<p:column headerText="Título"><h:outputText value="#{c.titulo}"/></p:column>
<p:column headerText="Categoria"><h:outputText value="#{c.categoria.rotulo}"/></p:column>
<p:column headerText="Situação"><h:outputText value="#{c.situacao}"/></p:column>
<p:column headerText="Ações">
<h:link outcome="/editar-contrato.xhtml" value="Editar" styleClass="link-acao-subtil"><f:param name="id" value="#{c.id}"/></h:link>
<h:link outcome="/visualizar-contrato.xhtml" value="Visualizar" styleClass="link-acao-subtil"><f:param name="id" value="#{c.id}"/></h:link>
<p:commandButton value="Excluir" icon="pi pi-trash" styleClass="ui-button-danger"
 process="@this" action="#{contratoBean.excluir(c.id)}" update="tabela avisos">
<p:confirm header="Confirmar" message="Excluir este contrato?"/></p:commandButton>
</p:column></p:dataTable></section>
<p:confirmDialog global="true">
<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no"/>
</p:confirmDialog></h:form></main></h:body></html>
