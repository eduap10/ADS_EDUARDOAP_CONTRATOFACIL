<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
xmlns:f="jakarta.faces.core" xmlns:p="primefaces">
<h:head><title>ContratoFácil | Documentos emitidos</title>
<h:outputStylesheet library="css" name="estilo.css"/></h:head>
<h:body><header><h1>ContratoFácil</h1><nav>
<h:link outcome="/index.xhtml" value="Início"/>
<h:link outcome="/colaboradores.xhtml" value="Colaboradores"/>
<h:link outcome="/tipos.xhtml" value="Tipos"/>
<h:link outcome="/modelos.xhtml" value="Modelos"/>
<h:link outcome="/contratos.xhtml" value="Contratos"/>
<h:form id="formSair" styleClass="form-sair"><h:commandLink action="#{loginBean.sair}" value="Sair"/></h:form>
</nav></header>
<main><h:form id="form"><section class="painel">
<div class="titulo"><div><h2>Contratos gerados</h2>
<p class="subtitulo">Documentos vinculados aos colaboradores. Visualize e exporte quando precisar.</p></div>
<h:link outcome="/editar-contrato.xhtml" value="＋ Gerar contrato" styleClass="link-acao"/>
</div>
<div class="barra"><div class="campo-busca">
<p:outputLabel for="pesquisa" value="Pesquisar por título, nome ou matrícula"/>
<p:inputText id="pesquisa" value="#{contratoBean.pesquisa}" style="width:100%"/></div>
<p:commandButton value="Pesquisar" icon="pi pi-search" process="pesquisa @this"
 action="#{contratoBean.pesquisar}" update="tabela avisos" styleClass="ui-button-sm"/>
</div>
<p:messages id="avisos" closable="true"/>
<p:dataTable id="tabela" var="contrato" value="#{contratoBean.lista}" paginator="true"
 rows="10" reflow="true" emptyMessage="Nenhum contrato gerado.">
<p:column headerText="Título"><h:outputText value="#{contrato.titulo}"/></p:column>
<p:column headerText="Colaborador"><h:outputText value="#{contratoBean.nomeColaborador(contrato.colaboradorId)}"/></p:column>
<p:column headerText="Tipo"><h:outputText value="#{contratoBean.nomeTipo(contrato.tipoId)}"/></p:column>
<p:column headerText="Situação"><h:outputText value="#{contrato.situacao}"/></p:column>
<p:column headerText="Ações" style="width:160px">
<h:link outcome="/visualizar-contrato.xhtml" styleClass="link-acao-subtil" title="Visualizar documento">
<f:param name="id" value="#{contrato.id}"/><i class="pi pi-eye"></i></h:link>
<h:link outcome="/editar-contrato.xhtml" styleClass="link-acao-subtil" title="Atualizar contrato">
<f:param name="id" value="#{contrato.id}"/><i class="pi pi-pencil"></i></h:link>
<p:commandButton icon="pi pi-trash" title="Excluir contrato" ariaLabel="Excluir contrato"
 styleClass="ui-button-danger ui-button-flat ui-button-rounded acao-icone"
 process="@this" action="#{contratoBean.excluir(contrato.id)}" update="tabela avisos">
<p:confirm header="Confirmar" message="Excluir definitivamente este contrato?"/>
</p:commandButton>
</p:column></p:dataTable>
</section><p:confirmDialog global="true">
<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no"/>
</p:confirmDialog></h:form></main></h:body></html>
