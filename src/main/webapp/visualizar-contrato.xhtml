<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
xmlns:f="jakarta.faces.core">
<f:metadata>
<f:viewParam name="id" value="#{visualizacaoBean.id}"/>
<f:viewAction action="#{visualizacaoBean.carregar}"/>
</f:metadata>
<h:head><title>ContratoFácil | Visualização</title>
<h:outputStylesheet library="css" name="estilo.css"/></h:head>
<h:body><header><h1>ContratoFácil</h1><nav>
<h:link outcome="/index.xhtml" value="Início"/>
<h:link outcome="/colaboradores.xhtml" value="Colaboradores"/>
<h:link outcome="/tipos.xhtml" value="Tipos"/>
<h:link outcome="/modelos.xhtml" value="Modelos"/>
<h:link outcome="/contratos.xhtml" value="Contratos"/>
<h:form id="formSair" styleClass="form-sair"><h:commandLink action="#{loginBean.sair}" value="Sair"/></h:form>
</nav></header>
<main class="pagina-documento">
<div class="titulo"><h2>Visualização do documento</h2><h:link outcome="/contratos.xhtml" value="Voltar" styleClass="link-acao-subtil"/></div>
<h:messages/>
<h:panelGroup rendered="#{not empty visualizacaoBean.contrato}">
<div class="barra-documento">
<h:link outcome="/editar-contrato.xhtml" value="Editar" styleClass="link-acao">
<f:param name="id" value="#{visualizacaoBean.id}"/></h:link>
<a href="#{request.contextPath}/exportar-contrato?id=#{visualizacaoBean.id}&amp;formato=pdf" class="link-acao-subtil">Salvar PDF</a>
<a href="#{request.contextPath}/exportar-contrato?id=#{visualizacaoBean.id}&amp;formato=docx" class="link-acao-subtil">Salvar DOCX</a>
<button type="button" onclick="window.print()" class="botao-imprimir">Imprimir</button>
</div>
<section class="folha-a4"><h3><h:outputText value="#{visualizacaoBean.contrato.titulo}"/></h3>
<div class="corpo-contrato"><h:outputText escape="false" value="#{visualizacaoBean.html}"/></div></section>
</h:panelGroup></main></h:body></html>
