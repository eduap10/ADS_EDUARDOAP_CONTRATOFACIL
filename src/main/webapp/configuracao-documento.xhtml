<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
xmlns:p="primefaces">
<h:head><title>ContratoFácil | Logo dos documentos</title><h:outputStylesheet library="css" name="estilo.css"/></h:head>
<h:body><header><h1>ContratoFácil</h1><nav>
<h:link outcome="/index.xhtml" value="Início"/>
<h:link outcome="/colaboradores.xhtml" value="Colaboradores"/>
<h:link outcome="/modelos.xhtml" value="Modelos"/>
<h:link outcome="/contratos.xhtml" value="Contratos"/>
<h:link outcome="/configuracao-documento.xhtml" value="Logo"/>
<h:form id="formSair" styleClass="form-sair"><h:commandLink action="#{loginBean.sair}" value="Sair"/></h:form>
</nav></header>
<main><section class="painel">
<h2>Logo da empresa</h2>
<p>Envie uma imagem PNG ou JPEG de até 1 MB. Para posicioná-la no contrato, insira a tag
<strong>{{empresa.logo}}</strong> no editor e use os controles de alinhamento.</p>
<h:form id="formLogo" enctype="multipart/form-data">
<p:messages id="avisos"/>
<p:fileUpload mode="advanced" auto="true" chooseLabel="Escolher logo"
listener="#{configuracaoDocumentoBean.enviar}" update="avisos"
sizeLimit="1000000" allowTypes="/(\.|\/)(png|jpe?g)$/"/>
</h:form></section></main></h:body></html>
