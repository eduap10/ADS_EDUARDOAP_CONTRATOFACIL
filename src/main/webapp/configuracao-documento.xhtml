<!DOCTYPE html>
<!-- Configuração de imagens institucionais. A tela envia o arquivo ao bean; o serviço e o banco são responsáveis pelo armazenamento. -->
<html xmlns:ui="jakarta.faces.facelets" xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
xmlns:p="primefaces">
<h:head><title>ContratoFácil | Logo dos documentos</title><h:outputStylesheet library="css" name="estilo.css"/><h:outputScript library="js" name="tema.js"/></h:head>
<h:body styleClass="cf-app"><ui:include src="/WEB-INF/fragmentos/navegacao.xhtml"><ui:param name="cfSecao" value="configuracoes"/></ui:include>
<main><section class="painel">
<h2>Logo da empresa</h2>
<p>Envie uma imagem PNG ou JPEG de até 1 MB. Para posicioná-la no contrato, insira a tag
<strong>{{empresa.logo}}</strong> no editor e use os controles de alinhamento.</p>
<h:form id="formLogo" enctype="multipart/form-data">
<p:messages id="avisos"/>
<p:fileUpload mode="advanced" auto="true" chooseLabel="Escolher logo"
listener="#{configuracaoDocumentoBean.enviar}" update="avisos"
allowTypes="/(\.|\/)(png|jpe?g)$/"/>
</h:form></section></main></h:body></html>
